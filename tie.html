<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#09090b"><meta name="description" content="Tennis Intelligence Engine — analyse prédictive tennis">
  <title>TIE — Analyse prédictive</title>
  <style>
    :root{color-scheme:dark;--bg:#09090b;--panel:#111114;--panel2:#17171b;--line:#29292f;--text:#f4f4f5;--muted:#a1a1aa;--dim:#71717a;--accent:#10b981;--warn:#fbbf24;--danger:#f87171}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#17251f 0,transparent 42%),var(--bg);color:var(--text);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}
    .wrap{width:min(100% - 32px,760px);margin:0 auto;padding:28px 0 56px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:34px;gap:12px}.brand{font-size:11px;font-weight:800;letter-spacing:.16em;color:#6ee7b7}.nav{display:flex;gap:8px}.nav a,.ghost{border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:#d4d4d8;text-decoration:none;font-size:12px;background:#101014}.hero{text-align:center;margin:0 auto 28px}.badge{display:inline-block;border:1px solid #14532d;background:#052e22;color:#6ee7b7;border-radius:99px;padding:5px 12px;font-size:10px;font-weight:800;letter-spacing:.13em}.hero h1{font-size:clamp(28px,6vw,42px);letter-spacing:-.04em;line-height:1.1;margin:16px 0 9px}.hero p{color:var(--muted);margin:0}.card{border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,#151519,#101013);padding:clamp(18px,4vw,28px);box-shadow:0 20px 60px #0005}.field{margin-bottom:16px}.field label{display:block;font-size:12px;font-weight:650;color:#d4d4d8;margin-bottom:7px}.field input{width:100%;border:1px solid #34343b;border-radius:11px;background:#09090b;padding:14px 15px;color:white;font:inherit;outline:none}.field input:focus{border-color:#059669;box-shadow:0 0 0 3px #05966925}.field input::placeholder{color:#52525b}.primary{width:100%;border:0;border-radius:11px;background:#047857;color:white;font-weight:800;letter-spacing:.04em;padding:15px;cursor:pointer}.primary:hover{background:#059669}.primary:disabled{opacity:.5;cursor:not-allowed}.statusline{font-size:11px;color:var(--dim);display:flex;justify-content:space-between;gap:10px;margin:14px 2px 0}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#71717a;margin-right:6px}.dot.ok{background:#10b981}.dot.bad{background:#f87171}.result{margin-top:20px}.result h2{font-size:16px;margin:0 0 10px}.result .message{color:var(--muted);font-size:13px}.match{text-align:center;font-size:19px;font-weight:800;margin:10px 0 3px}.sub{text-align:center;color:var(--muted);font-size:12px}.selection{margin-top:18px;background:#09090b;border:1px solid #24352e;border-radius:13px;padding:18px;text-align:center}.selection .market{font-size:12px;color:var(--muted)}.selection .pick{font-size:22px;font-weight:800;color:#6ee7b7;margin-top:3px}.selection .odds{margin-top:6px}.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:12px}.metric{background:#09090b;border:1px solid #24242a;border-radius:11px;padding:12px;text-align:center}.metric small{display:block;color:var(--dim);font-size:10px}.metric strong{display:block;font-size:18px;margin-top:3px}.green{color:#6ee7b7}.factors{padding-left:18px;color:var(--muted);font-size:12px}.candidate{width:100%;text-align:left;border:1px solid var(--line);border-radius:11px;background:#09090b;color:white;padding:13px;margin-top:8px;cursor:pointer}.candidate:hover{border-color:#059669}.candidate small{display:block;color:var(--dim);margin-top:4px}.warning{border-color:#57451a}.warning h2{color:var(--warn)}.error{border-color:#5b2424;color:#fca5a5}.foot{text-align:center;color:#52525b;font-size:10px;margin-top:26px}
    @media(min-width:600px){.metrics{grid-template-columns:repeat(4,1fr)}}
  </style>
</head>
<body><main class="wrap">
  <header class="top"><div class="brand">TENNIS INTELLIGENCE ENGINE</div><nav class="nav"><a href="/dashboard.html">Dashboard ↗</a></nav></header>
  <section class="hero"><span class="badge">TIE · ANALYSE PRÉDICTIVE</span><h1>Lire le match.<br>Mesurer la valeur.</h1><p>BetPawa · Elo · modèles ML · une sélection ou aucune.</p></section>
  <section class="card">
    <form id="analyzeForm">
      <div class="field"><label for="player1">PREMIER JOUEUR</label><input id="player1" name="player1" placeholder="Ex. Pegula" autocomplete="off" required></div>
      <div class="field"><label for="player2">DEUXIÈME JOUEUR</label><input id="player2" name="player2" placeholder="Ex. Andreeva" autocomplete="off" required></div>
      <button class="primary" id="submitBtn" type="submit">LANCER L’ANALYSE</button>
    </form>
    <div class="statusline"><span id="apiState"><i class="dot"></i>Vérification du service…</span><span id="storageState">Stockage : vérification</span></div>
  </section>
  <section id="result" class="result" aria-live="polite"></section>
  <p class="foot">Cote minimale 1,25 · EV minimum 3 % · données traçables · aucune donnée inventée.</p>
</main>
<script>
const $=s=>document.querySelector(s);const resultBox=$('#result');let lastPlayers={p1:'',p2:''};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function checkHealth(){try{const r=await fetch('/api/health',{cache:'no-store'});const d=await r.json();$('#apiState').innerHTML='<i class="dot '+(r.ok?'ok':'bad')+'"></i>Service '+(r.ok?'accessible':'indisponible');$('#storageState').textContent='Stockage : '+(d.storage==='supabase'?'Supabase':'local / fichier');}catch{$('#apiState').innerHTML='<i class="dot bad"></i>Service inaccessible';$('#storageState').textContent='Stockage : non vérifié';}}
function showLoading(){resultBox.innerHTML='<div class="card"><p class="message">Analyse en cours : récupération des événements et calcul des indicateurs…</p></div>';}
function render(d){if(d.status==='AMBIGUOUS'){resultBox.innerHTML='<div class="card"><h2>Plusieurs rencontres trouvées</h2><p class="message">'+esc(d.message)+'</p>'+(d.candidates||[]).map(c=>'<button class="candidate" data-event="'+esc(c.eventId)+'"><strong>'+esc(c.player1)+' vs '+esc(c.player2)+'</strong><small>'+(c.isLive?'EN DIRECT':esc(c.startTime||'Horaire non disponible'))+(c.odds?' · Cotes '+esc(c.odds):'')+'</small></button>').join('')+'</div>';resultBox.querySelectorAll('[data-event]').forEach(b=>b.addEventListener('click',()=>analyze(b.dataset.event)));return;}
if(d.status==='SELECTED'){resultBox.innerHTML='<div class="card"><div class="statusline"><span class="green">● SÉLECTION VALIDÉE</span><span>'+(d.isLive?'EN DIRECT':esc(d.startTime||''))+'</span></div><div class="match">'+esc(d.player1)+' vs '+esc(d.player2)+'</div><div class="sub">'+esc(d.tournament||'Tournoi non précisé')+'</div><div class="selection"><div class="market">'+esc(d.market)+'</div><div class="pick">'+esc(d.selection)+'</div><div class="odds">Cote <strong>'+Number(d.odds).toFixed(2)+'</strong></div></div><div class="metrics"><div class="metric"><small>PROBABILITÉ ESTIMÉE</small><strong>'+((d.estimatedProb||0)*100).toFixed(1)+'%</strong></div><div class="metric"><small>VALEUR ATTENDUE</small><strong class="green">'+((d.expectedValue||0)*100).toFixed(1)+'%</strong></div><div class="metric"><small>CONFIANCE</small><strong>'+Number(d.confidence||0).toFixed(0)+'%</strong></div><div class="metric"><small>RISQUE</small><strong>'+Number(d.riskScore||0).toFixed(1)+'/10</strong></div></div><ul class="factors">'+(d.factors||[]).map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul><p class="message">Modèle : '+esc(d.model||'—')+' · analyse enregistrée si le stockage serveur est configuré.</p></div>';return;}
if(d.status==='NO_VALID_PREDICTION'){let diag=d.diagnostic?'<div class="selection warning"><div class="market">MEILLEUR CANDIDAT REJETÉ</div><strong>'+esc(d.diagnostic.bestLabel)+'</strong><div class="metrics"><div class="metric"><small>COTE</small><strong>'+Number(d.diagnostic.odds).toFixed(2)+'</strong></div><div class="metric"><small>PROBABILITÉ</small><strong>'+(d.diagnostic.estimatedProb*100).toFixed(1)+'%</strong></div><div class="metric"><small>EV</small><strong>'+(d.diagnostic.ev*100).toFixed(1)+'%</strong></div><div class="metric"><small>QUALITÉ</small><strong>'+(d.diagnostic.dataQuality*100).toFixed(0)+'%</strong></div></div></div>':'';resultBox.innerHTML='<div class="card warning"><h2>AUCUNE PRÉDICTION VALIDÉE</h2><p class="message">'+esc(d.message||'Les seuils de validation ne sont pas atteints.')+'</p>'+((d.player1||d.oddsP1)?'<p class="message">'+esc(d.player1)+' vs '+esc(d.player2)+' · cotes : '+(d.oddsP1?Number(d.oddsP1).toFixed(2):'—')+' / '+(d.oddsP2?Number(d.oddsP2).toFixed(2):'—')+'</p>':'')+diag+'<p class="message">'+esc(d.note||'')+'</p></div>';return;}
resultBox.innerHTML='<div class="card error"><h2>Analyse impossible</h2><p class="message">'+esc(d.message||'Une erreur est survenue.')+'</p></div>';}
async function analyze(eventId){const p1=$('#player1').value.trim(),p2=$('#player2').value.trim();if(!p1||!p2)return;lastPlayers={p1,p2};$('#submitBtn').disabled=true;$('#submitBtn').textContent='ANALYSE EN COURS…';showLoading();try{const r=await fetch('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({player1:p1,player2:p2,eventId:eventId||undefined})});const d=await r.json();render(d);if(!r.ok&&d.status!=='ERROR')throw new Error(d.message||'Erreur serveur');}catch(e){render({status:'ERROR',message:e.message||'Erreur réseau'});}finally{$('#submitBtn').disabled=false;$('#submitBtn').textContent='LANCER L’ANALYSE';checkHealth();}}
$('#analyzeForm').addEventListener('submit',e=>{e.preventDefault();analyze();});checkHealth();
</script></body></html>
