<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09090b"><title>TIE — Performances</title>
<style>
:root{color-scheme:dark;--bg:#09090b;--panel:#111114;--line:#29292f;--text:#f4f4f5;--muted:#a1a1aa;--dim:#71717a;--green:#6ee7b7;--red:#fca5a5}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#17251f 0,transparent 42%),var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,sans-serif}.wrap{width:min(100% - 32px,1050px);margin:auto;padding:28px 0 60px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:30px}.brand{font-size:11px;font-weight:800;letter-spacing:.15em;color:var(--green)}a,.btn{color:#d4d4d8;text-decoration:none;border:1px solid var(--line);border-radius:9px;padding:8px 12px;background:#101014;font-size:12px;cursor:pointer}.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:14px}.head h1{font-size:clamp(24px,5vw,34px);letter-spacing:-.04em;margin:4px 0}.muted{color:var(--muted);font-size:12px}.backend{font-size:11px;color:var(--dim);margin:12px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.kpi,.panel{border:1px solid var(--line);border-radius:13px;background:linear-gradient(145deg,#151519,#101013);padding:15px}.kpi small{color:var(--dim);font-size:10px}.kpi strong{display:block;font-size:24px;margin-top:5px}.green{color:var(--green)}.section{margin-top:30px}.section h2{font-size:12px;letter-spacing:.12em;color:#a1a1aa;text-transform:uppercase;margin-bottom:12px}.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}table{border-collapse:collapse;width:100%;min-width:500px;font-size:12px}th,td{text-align:left;padding:11px 13px;border-bottom:1px solid var(--line)}th{color:var(--dim);background:#151519;font-weight:600}td{color:#d4d4d8}.history{display:grid;gap:9px}.item{border:1px solid var(--line);border-radius:12px;background:#111114;padding:14px}.itemtop{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.item strong{font-size:13px}.actions{display:flex;gap:5px;margin-top:10px}.actions button{border:1px solid var(--line);border-radius:7px;padding:6px 9px;background:#18181b;color:#d4d4d8;font-size:11px;cursor:pointer}.actions .win{color:var(--green)}.actions .loss{color:var(--red)}.empty,.error{padding:26px;text-align:center;color:var(--muted);border:1px solid var(--line);border-radius:12px;background:#111114}.error{color:var(--red)}@media(min-width:650px){.grid{grid-template-columns:repeat(4,1fr)}}
</style></head><body><main class="wrap"><header class="top"><div class="brand">TENNIS INTELLIGENCE ENGINE</div><a href="/tie.html">← ANALYSE</a></header><div class="head"><div><div class="muted">TABLEAU DE BORD</div><h1>Performances</h1><div class="muted">Uniquement les données réellement enregistrées.</div></div><button class="btn" id="refresh">Actualiser ↻</button></div><div class="backend" id="backend">Connexion au stockage…</div><div id="content"><div class="empty">Chargement des statistiques…</div></div></main>
<script>
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const n=(v,d=2)=>v==null?'—':Number(v).toFixed(d);const pct=v=>v==null?'—':(Number(v)*100).toFixed(1)+'%';
async function settle(id,result,btn){btn.disabled=true;try{const r=await fetch('/api/predictions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'settle',id,result})});if(!r.ok){const d=await r.json();throw new Error(d.error||'Mise à jour impossible')}await load()}catch(e){alert(e.message);btn.disabled=false}}
function tableRows(obj){return Object.entries(obj||{}).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v.n}</td><td>${v.wins}</td><td>${v.losses}</td><td>${n(v.profit)}</td></tr>`).join('')}
async function load(){ $('#content').innerHTML='<div class="empty">Chargement…</div>';try{const [r,h]=await Promise.all([fetch('/api/performance',{cache:'no-store'}),fetch('/api/health',{cache:'no-store'})]);if(!r.ok)throw new Error('API performances : HTTP '+r.status);const s=await r.json(),health=await h.json();$('#backend').textContent='Stockage actif : '+(health.storage==='supabase'?'Supabase':'fichier local')+' · '+(health.supabaseConfigured?'Supabase configuré':'Supabase non configuré');const kpis=[['ANALYSES',s.totalAnalyses],['SÉLECTIONS',s.selected],['SANS PRÉDICTION',s.noValid],['RÉGLÉES',s.settled],['TAUX DE RÉUSSITE',pct(s.hitRate)+' · '+s.wins+'W / '+s.losses+'L'],['ROI',pct(s.roi)],['PROFIT (UNITÉS)',n(s.profitUnits)],['COTE MOYENNE',n(s.avgOdds)]];let html='<div class="grid">'+kpis.map(([l,v])=>`<div class="kpi"><small>${l}</small><strong>${esc(v??'—')}</strong></div>`).join('')+'</div>';
if(s.totalAnalyses===0)html+='<div class="empty section">Aucune analyse enregistrée pour le moment.</div>';
if(Object.keys(s.byMarket||{}).length)html+='<section class="section"><h2>Performance par marché</h2><div class="tablewrap"><table><thead><tr><th>Marché</th><th>N</th><th>W</th><th>L</th><th>Profit</th></tr></thead><tbody>'+tableRows(s.byMarket)+'</tbody></table></div></section>';
if(Object.keys(s.byModel||{}).length)html+='<section class="section"><h2>Performance par modèle</h2><div class="tablewrap"><table><thead><tr><th>Modèle</th><th>N</th><th>W</th><th>L</th><th>Profit</th></tr></thead><tbody>'+tableRows(s.byModel)+'</tbody></table></div></section>';
if((s.recent||[]).length){html+='<section class="section"><h2>Historique récent</h2><div class="history">'+s.recent.map(p=>{let state=p.settled?`<span class="${p.result==='win'?'green':p.result==='loss'?'':'muted'}">${esc(p.result)} · ${p.profitUnits>0?'+':''}${n(p.profitUnits)}u</span>`:p.status==='SELECTED'?'<span class="muted">En attente</span>':'';let actions=!p.settled&&p.status==='SELECTED'?`<div class="actions"><button class="win" data-id="${esc(p.id)}" data-result="win">Win</button><button class="loss" data-id="${esc(p.id)}" data-result="loss">Loss</button><button data-id="${esc(p.id)}" data-result="void">Void</button></div>`:'';return `<article class="item"><div class="itemtop"><div><strong>${esc(p.player1)} vs ${esc(p.player2)}</strong><div class="muted">${p.createdAt?new Date(p.createdAt).toLocaleString('fr-FR'):''}${p.market?' · '+esc(p.market):''}${p.model?' · '+esc(p.model):''}</div>${p.status==='SELECTED'?`<div class="green">${esc(p.selection)} @ ${n(p.odds)} · EV ${pct(p.expectedValue)}</div>`:'<div class="muted">Aucune prédiction validée</div>'}</div><div>${state}</div></div>${actions}</article>`}).join('')+'</div></section>'}
$('#content').innerHTML=html;$('#content').querySelectorAll('[data-id]').forEach(b=>b.addEventListener('click',()=>settle(b.dataset.id,b.dataset.result,b)));
}catch(e){$('#backend').textContent='Stockage : erreur de connexion';$('#content').innerHTML='<div class="error">'+esc(e.message||'Impossible de charger les performances.')+'</div>'}}
$('#refresh').addEventListener('click',load);load();
</script></body></html>
